# managed by Doctorine — edits will be overwritten
name: Doctorine SDK Manual Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish
        required: true
        type: string
      tag_name:
        description: Existing release tag
        required: true
        type: string
jobs:
  publish:
    if: vars.DOCTORINE_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: parcel-events-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag_name }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.8.17
      - name: Build package
        shell: bash
        run: uv build
      - name: Publish PyPI package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      - name: Report publication hint to Doctorine
        if: always()
        continue-on-error: true
        shell: bash
        run: |-
          set -euo pipefail
          log() { printf 'doctorine-receipt %s\n' "$1" >&2; }
          problem_class() { jq -r '.type' /tmp/doctorine-receipt-response 2>/dev/null | tail -n 1 | sed 's#^.*/##' | tr -cd 'a-z0-9-' | cut -c1-64; }
          started_ms=$(date +%s%3N)
          encoded_audience=$(jq -nr --arg value "$DOCTORINE_RECEIPT_AUDIENCE" '$value|@uri')
          oidc_raw=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 20 --max-filesize "$DOCTORINE_CALLBACK_MAX_BODY" \
            --write-out '\n%{http_code}' \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}") && oidc_exit=0 || oidc_exit=$?
          oidc_code=$(printf '%s' "$oidc_raw" | tail -n 1)
          case "$oidc_code" in ''|*[!0-9]*) oidc_code=000 ;; esac
          if [ "$oidc_exit" -ne 0 ] || [ "$oidc_code" -lt 200 ] || [ "$oidc_code" -ge 300 ]; then
            log "class=oidc_request_failed transport=error curl_exit=$oidc_exit http_status=$oidc_code"
            exit 1
          fi
          oidc_token=$(printf '%s' "$oidc_raw" | sed '$d' | jq -er '.value') || {
            log "class=oidc_token_missing transport=ok curl_exit=0 http_status=$oidc_code"
            exit 1
          }
          body=$(jq -cn \
            --arg conclusion "$DOCTORINE_JOB_STATUS" \
            --arg registry "$DOCTORINE_REGISTRY" \
            --arg packageName "$DOCTORINE_PACKAGE_NAME" \
            --arg repoFullName "$GITHUB_REPOSITORY" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg headSha "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg tagName "$DOCTORINE_RELEASE_TAG" \
            --arg target "$DOCTORINE_TARGET" \
            --arg version "$DOCTORINE_RELEASE_VERSION" \
            '{repoFullName:$repoFullName,runId:$runId,runAttempt:$runAttempt,workflowRef:$workflowRef,headSha:$headSha,target:$target,registry:$registry,packageName:$packageName,version:$version,conclusion:(if $conclusion == "success" then "succeeded" else "failed" end)} + (if $tagName == "" then {} else {tagName:$tagName} end)')
          body_bytes=$(printf %s "$body" | wc -c | tr -d ' ')
          if [ "$body_bytes" -gt "$DOCTORINE_CALLBACK_MAX_REQUEST_BODY" ]; then
            log "class=request_body_too_large transport=none curl_exit=none http_status=none"
            exit 1
          fi
          attempt=1
          while [ "$attempt" -le "$DOCTORINE_CALLBACK_MAX_ATTEMPTS" ]; do
            now_ms=$(date +%s%3N)
            remaining_ms=$((DOCTORINE_CALLBACK_MAX_ELAPSED_MS - now_ms + started_ms))
            if [ "$remaining_ms" -le 0 ]; then
              log "class=budget_exhausted transport=none curl_exit=none http_status=none attempt=$attempt"
              exit 1
            fi
            remaining_seconds=$(((remaining_ms + 999) / 1000))
            code=$(curl --silent --show-error --output /tmp/doctorine-receipt-response \
              --dump-header /tmp/doctorine-receipt-headers \
              --write-out '%{http_code}' --max-filesize "$DOCTORINE_CALLBACK_MAX_BODY" \
              --connect-timeout 10 --max-time "$remaining_seconds" \
              -H "Authorization: Bearer $oidc_token" -H 'Content-Type: application/json' \
              -H "Idempotency-Key: ${GITHUB_REPOSITORY_ID}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${DOCTORINE_TARGET}:${DOCTORINE_REGISTRY}" \
              --data-binary "$body" "$DOCTORINE_RECEIPT_ENDPOINT") && curl_exit=0 || curl_exit=$?
            case "$code" in ''|*[!0-9]*) code=000 ;; esac
            if [ "$curl_exit" -eq 0 ]; then transport=ok; else transport=error; fi
            if [ "$transport" = ok ] && [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              log "class=delivered transport=ok curl_exit=0 http_status=$code attempt=$attempt"
              exit 0
            fi
            error_class=$(problem_class) || error_class=
            if [ -z "$error_class" ]; then error_class=none; fi
            log "class=attempt_failed transport=$transport curl_exit=$curl_exit http_status=$code attempt=$attempt error=$error_class"
            if [ "$attempt" -ge "$DOCTORINE_CALLBACK_MAX_ATTEMPTS" ]; then
              log "class=attempts_exhausted transport=$transport curl_exit=$curl_exit http_status=$code attempt=$attempt error=$error_class"
              exit 1
            fi
            if [ "$transport" = ok ] && [ "$code" != 408 ] && [ "$code" != 429 ] && [ "$code" -lt 500 ]; then
              log "class=http_not_retryable transport=ok curl_exit=0 http_status=$code attempt=$attempt error=$error_class"
              exit 1
            fi
            ceiling_ms=$((DOCTORINE_CALLBACK_INITIAL_DELAY_MS << (attempt - 1)))
            if [ "$ceiling_ms" -gt "$DOCTORINE_CALLBACK_MAX_DELAY_MS" ]; then ceiling_ms=$DOCTORINE_CALLBACK_MAX_DELAY_MS; fi
            delay_ms=$((RANDOM % (ceiling_ms + 1)))
            retry_after=$(awk 'BEGIN { IGNORECASE=1 } /^Retry-After:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' /tmp/doctorine-receipt-headers)
            if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
              retry_after_ms=$((retry_after * 1000))
            elif [ -n "$retry_after" ]; then
              retry_epoch=$(date -d "$retry_after" +%s 2>/dev/null || true)
              now_epoch=$(date +%s)
              if [[ "$retry_epoch" =~ ^[0-9]+$ ]] && [ "$retry_epoch" -gt "$now_epoch" ]; then retry_after_ms=$(((retry_epoch - now_epoch) * 1000)); else retry_after_ms=0; fi
            else
              retry_after_ms=0
            fi
            if [ "$retry_after_ms" -gt "$delay_ms" ]; then delay_ms=$retry_after_ms; fi
            if [ "$delay_ms" -gt "$DOCTORINE_CALLBACK_MAX_DELAY_MS" ]; then delay_ms=$DOCTORINE_CALLBACK_MAX_DELAY_MS; fi
            now_ms=$(date +%s%3N)
            remaining_ms=$((DOCTORINE_CALLBACK_MAX_ELAPSED_MS - now_ms + started_ms))
            if [ "$delay_ms" -gt "$remaining_ms" ]; then delay_ms=$remaining_ms; fi
            if [ "$delay_ms" -le 0 ]; then
              log "class=budget_exhausted transport=$transport curl_exit=$curl_exit http_status=$code attempt=$attempt"
              exit 1
            fi
            sleep "$(awk "BEGIN { print $delay_ms / 1000 }")"
            attempt=$((attempt + 1))
          done
          log "class=attempts_exhausted transport=none curl_exit=none http_status=none attempt=$attempt"
          exit 1
        env:
          DOCTORINE_RECEIPT_ENDPOINT: https://api.doctorine.xyz/v1/sdk/receipts
          DOCTORINE_RECEIPT_AUDIENCE: https://api.doctorine.xyz/v1/sdk/receipts
          DOCTORINE_TARGET: python
          DOCTORINE_REGISTRY: pypi
          DOCTORINE_PACKAGE_NAME: parcel-events-sdk-fixture-260904
          DOCTORINE_JOB_STATUS: ${{ job.status }}
          DOCTORINE_RELEASE_VERSION: ${{ inputs.version }}
          DOCTORINE_RELEASE_TAG: ${{ inputs.tag_name }}
          DOCTORINE_CALLBACK_MAX_ATTEMPTS: "3"
          DOCTORINE_CALLBACK_MAX_ELAPSED_MS: "60000"
          DOCTORINE_CALLBACK_INITIAL_DELAY_MS: "500"
          DOCTORINE_CALLBACK_MAX_DELAY_MS: "8000"
          DOCTORINE_CALLBACK_MAX_BODY: "1048576"
          DOCTORINE_CALLBACK_MAX_REQUEST_BODY: "1048576"
